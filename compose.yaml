services:
  frontend:
    build:
      context: .
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.jusana.space}
    restart: unless-stopped

    ports:
      - '${FRONTEND_PORT:-8080}:80'

    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1/health',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
